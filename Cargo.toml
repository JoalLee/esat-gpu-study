[package]
name = "esat_rust"
version = "0.1.0"
edition = "2021"
authors = ["Deron Smith <smith.deron@epa.gov>"]
description = "EPA Environmental Source Apportionment Toolkit (ESAT) Rust Algorithms"
readme = "README.md"
license-file = "LICENSE"

[lib]
name = "esat_rust"
path = "rust/lib.rs"
crate-type = ["cdylib"]

[dependencies]
numpy = "0.25.0"
nalgebra = "0.33.2"
ndarray = "0.16.1"
pyo3 = { version = "0.25.1", features = ["extension-module"] }
indicatif = "0.18.0"
console = "0.16.0"
# GPU backends: select via --features cuda (NVIDIA) or --features metal (Apple Silicon)
candle-core = { version = "0.11.0" }

[patch.crates-io]
candle-core = { path = "vendor/candle-core-0.11.0" }

[features]
extension-module = ["pyo3/extension-module", "pyo3/generate-import-lib"]
default = ["extension-module"]
cuda = ["candle-core/cuda"]
metal = ["candle-core/metal"]

[profile.dev]
opt-level = 3
debug = false

[profile.release]
opt-level = 3
debug = false
