name: Span Identifiability Pilot

on:
  push:
    branches:
      - feature/distributional-source-types
    paths:
      - 'eval/span_*.py'
      - 'eval/lowrank_recovery.py'
      - 'esat/model/distributional_sa.py'
      - 'esat/model/lowrank_distributional_sa.py'
      - 'scripts/run_span_identifiability.py'
      - '.github/workflows/span-identifiability-pilot.yml'
  workflow_dispatch:

jobs:
  pilot-grid:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.2.6 scipy==1.15.3 pandas==2.3.0
      - name: Run multi-seed geometric phase diagram pilot
        run: |
          python scripts/run_span_identifiability.py \
            --alignments 0,0.25,0.5,0.75,1 \
            --variability 0.4,0.7 \
            --noise 0.01,0.03 \
            --seeds 7,11,17 \
            --models static,v1,lowrank \
            --factors 3 \
            --features 9 \
            --samples 100 \
            --v1-profile-penalty 1.0 \
            --v2-profile-penalty 0.005 \
            --v2-sv-shrinkage 0.5 \
            --init-iter 120 \
            --max-iter 8 \
            --profile-steps 4 \
            --output output/distributional/span_pilot.csv
      - name: Upload pilot CSV
        uses: actions/upload-artifact@v4
        with:
          name: span-identifiability-pilot
          path: output/distributional/span_pilot.csv
