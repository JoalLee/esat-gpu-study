name: Distributional Source-Type Tests

on:
  push:
    branches:
      - feature/distributional-source-types
  pull_request:
    paths:
      - 'esat/model/distributional_sa.py'
      - 'esat/model/lowrank_distributional_sa.py'
      - 'eval/distributional_*.py'
      - 'eval/lowrank_*.py'
      - 'eval/span_*.py'
      - 'tests/model/test_distributional_sa.py'
      - 'tests/model/test_lowrank_distributional_sa.py'
      - 'tests/eval/test_span_controlled_simulator.py'
      - 'tests/eval/test_span_identifiability.py'
      - 'scripts/run_distributional_*.py'
      - 'scripts/run_lowrank_distributional_*.py'
      - 'scripts/run_span_*.py'
      - '.github/workflows/distributional-tests.yml'

jobs:
  test-distributional:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.2.6 scipy==1.15.3 pandas==2.3.0 pytest==9.1.1
      - name: Compile prototype modules
        run: |
          python -m py_compile \
            esat/model/distributional_sa.py \
            esat/model/lowrank_distributional_sa.py \
            eval/distributional_simulator.py \
            eval/distributional_recovery.py \
            eval/lowrank_recovery.py \
            eval/distributional_identifiability.py \
            eval/span_controlled_simulator.py \
            eval/span_identifiability.py \
            scripts/run_distributional_synthetic.py \
            scripts/run_lowrank_distributional_synthetic.py \
            scripts/run_distributional_phase_diagram.py \
            scripts/run_span_identifiability.py
      - name: Run targeted tests
        run: |
          pytest tests/model/test_distributional_sa.py -q
          pytest tests/model/test_lowrank_distributional_sa.py -q
          pytest tests/eval/test_span_controlled_simulator.py -q
          pytest tests/eval/test_span_identifiability.py -q
      - name: Run V1 smoke experiment
        run: |
          python scripts/run_distributional_synthetic.py \
            --factors 2 \
            --features 7 \
            --samples 40 \
            --variability 0.05,0.25 \
            --profile-penalty 1.0 \
            --init-iter 100 \
            --max-iter 5 \
            --profile-steps 3
      - name: Run low-rank V2 smoke experiment
        run: |
          python scripts/run_lowrank_distributional_synthetic.py \
            --factors 2 \
            --features 8 \
            --samples 80 \
            --variability 0.00,0.35 \
            --variability-rank 1 \
            --fit-rank 1 \
            --profile-penalty 0.005 \
            --sv-shrinkage 0.5 \
            --noise-fraction 0.02 \
            --init-iter 150 \
            --max-iter 8 \
            --profile-steps 5
      - name: Run span-identifiability smoke grid
        run: |
          python scripts/run_span_identifiability.py \
            --alignments 0,1 \
            --variability 0.7 \
            --noise 0.01 \
            --seeds 7 \
            --models static,lowrank \
            --factors 3 \
            --features 9 \
            --samples 80 \
            --init-iter 100 \
            --max-iter 6 \
            --profile-steps 4 \
            --output output/distributional/span_ci.csv
