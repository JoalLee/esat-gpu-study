[package]
name = "test_candle"
version = "0.1.0"
edition = "2021"

[dependencies]
candle-core = { version = "0.11.0", features = ["metal", "accelerate"] }
candle-metal-kernels = "0.11.0"
objc2-metal = "0.3.2"

[patch.crates-io]
candle-core = { path = "../vendor/candle-core-0.11.0" }

[[bin]]
name = "test_candle"
path = "src/main.rs"

[[bin]]
name = "nmf_bench"
path = "src/nmf_bench.rs"

[[bin]]
name = "metal_probe"
path = "src/metal_probe.rs"

[profile.release]
opt-level = 3
